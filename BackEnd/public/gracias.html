<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Formulario enviado!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      background-color: #dcfce7;
      color: #16a34a;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #111827;
    }

    p {
      font-size: 15px;
      color: #4b5563;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 15px;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="icon">✓</div>
    <h1>¡Gracias por contactarnos!</h1>
    <p>Tu formulario se envió correctamente. Hemos recibido tus datos y nos pondremos en contacto contigo a la brevedad.</p>
    <a href="/" class="btn">Volver al inicio</a>
  </main>

</body>
</html>
